name: MasterlawEX Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'web-overlay/**'
      - 'contracts/MasterlawEXP2PEscrowV14.sol'
      - 'scripts/compile.js'
      - 'build/artifacts.json'
      - '.github/workflows/masterlawex-frontend-ci.yml'
  pull_request:
    paths:
      - 'web-overlay/**'
      - 'contracts/MasterlawEXP2PEscrowV14.sol'
      - 'scripts/compile.js'
      - 'build/artifacts.json'
      - '.github/workflows/masterlawex-frontend-ci.yml'

permissions:
  contents: read

jobs:
  build-and-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web-overlay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build fresh protocol ABI inputs
        shell: bash
        run: |
          set -euo pipefail
          cd ..
          npm ci --no-audit --no-fund
          npm run build
          test -s build/artifacts.json
          node -e "const a=require('./build/artifacts.json'); if(!a.MasterlawEXP2PEscrowV14?.methodIdentifiers) process.exit(1)"
      - name: Verify local base snapshot
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app.css core.js earn.html earn.js identity.html index.html
            list.html list.js portfolio.html portfolio.js protocol.html protocol.js
            registry.js startup.html startup.js trade.js
          )
          for file in "${files[@]}"; do
            test -s "base/${file}" || { echo "Missing base/${file}"; exit 1; }
          done
          test -s mediation.html
          test -s mediation.js
          test -s mediation-admin.js
          ! grep -q 'https://arcx-exchange.vercel.app' build.js
          ! grep -q 'fetch(' build.js
      - name: Validate ARC network and identity configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "chain:'0x4cef52'" base/core.js
          grep -q "rpc:'https://rpc.testnet.arc.io'" base/core.js
          grep -q "rpcs:\['https://rpc.testnet.arc.io','https://rpc.testnet.arc.network'\]" base/core.js
          grep -q "explorer:'https://testnet.arcscan.app'" base/core.js
          grep -q "usdc:'0x3600000000000000000000000000000000000000'" base/core.js
          grep -q 'READ_RPC_METHODS' base/core.js
          grep -q 'rpcUrls:C.rpcs' base/core.js
          grep -q 'ensureChain,wait,send' base/core.js
          grep -q "P2P_BUILD='83cdc85310add7e791b955bb63dfbfea0976eb6e'" base/protocol.js
          grep -q "P2P_BUILD_ID='0x762d93a9ce52445a9beced69f6aba33aa60734f6c7ca0242b594ad505ad7ed86'" base/protocol.js
          grep -q "P2P_ORDER_REF_DOMAIN='0xa8e22b39121058b75ab1c64c27412cd473a621f194cb1636443b2662dc0f8f66'" base/protocol.js
          grep -q 'P2P_RECORD_SCHEMA=3' base/protocol.js
          grep -q 'P2P_RECORD_SCHEMA=3' p2p.js
          grep -q "trade:'0x1e6c598e'" p2p.js
          grep -q "byRef:'0x0bb784d8'" p2p.js
          grep -q 'ARC TESTNET ONLY' base/protocol.html
          grep -q "MASTERLAW_API='https://masterlaw-api.vercel.app'" mediation.js
          grep -q "P2P_SESSION_KEY='masterlawex:p2p:session:v1'" mediation.js
          grep -q '/api/exchange/p2p/bind-wallet' mediation.js
          grep -q "entitlement:'\[MEMORY_ONLY\]'" mediation.js
          grep -q 'WALLET · UNBOUND' mediation.html
          grep -q 'Vincular wallet ARC' mediation.html
          grep -q 'REAL MONEY · OFF' mediation.html
          grep -q 'broadcastByBrowser:false' mediation.js
          grep -q 'Masterlaw P2P Case Workspace' mediation.html
          grep -q '/api/exchange/p2p/admin/state-machine' mediation-admin.js
          grep -q '/api/exchange/p2p/admin/prepare-case' mediation-admin.js
          grep -q '/api/exchange/p2p/admin/prepare-evidence' mediation-admin.js
          grep -q '/api/exchange/p2p/admin/prepare-resolution' mediation-admin.js
          grep -q 'ADMIN_CONTROL_PLANE_SCOPE_MISMATCH' mediation-admin.js
          grep -q 'MASTERLAWEX_P2P_ACTIVATION_READINESS_V2' mediation-admin.js
          grep -q 'P2P Activation Readiness' mediation-admin.js
          grep -q 'ENTITLEMENT VERIFY · ONLINE' mediation-admin.js
          grep -q 'EDGE ENFORCEMENT · BLOCKED' mediation-admin.js
          grep -q 'CASE STORE · BLOCKED' mediation-admin.js
          grep -q 'REAL P2P · BLOCKED' mediation-admin.js
          grep -q "STATELESS_PLUS_CURRENT_KYC_RECHECK" mediation-admin.js
          grep -q "/api/exchange/p2p/verify-entitlement" mediation-admin.js
          grep -q 'P2P_EDGE_ENTITLEMENT_ENFORCEMENT_NOT_ENABLED' mediation-admin.js
          grep -q 'const serverEntitlementEnforced=false' mediation-admin.js
          grep -q 'const casePersistenceEnabled=false' mediation-admin.js
          grep -q 'const realMoneyEnabled=false' mediation-admin.js
          grep -q 'supabase_mutation_performed:false' mediation-admin.js
          grep -q 'browser_arbitration_broadcast:false' mediation-admin.js
          grep -q 'MASTERLAWEX_RELEASE_V1' build.js
          grep -q 'VERCEL_GIT_COMMIT_SHA' build.js
          grep -q "fetch('/release.json'" mediation-admin.js
          grep -q 'release_manifest_verified' mediation-admin.js
          ! grep -E '(localStorage|sessionStorage)\.setItem\([^)]*(entitlement|walletEntitlement)' mediation.js
          ! grep -E 'localStorage|sessionStorage' mediation-admin.js
          ! grep -E 'eth_sendTransaction|private[_ -]?key|secretKey' mediation-admin.js
          ! grep -R -E '84532|Base Sepolia|sepolia.basescan' base p2p.html p2p.js agents.html agents.js demo.html demo.js mediation.html mediation.js mediation-admin.js
      - name: JavaScript syntax checks
        run: |
          node --check build.js
          node --check p2p.js
          node --check agents.js
          node --check demo.js
          node --check mediation.js
          node --check mediation-admin.js
          node --check base/core.js
          node --check base/protocol.js
      - name: Build frontend
        run: npm run build
      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/p2p.html
          test -s dist/p2p.js
          test -s dist/agents.html
          test -s dist/protocol.html
          test -s dist/protocol.js
          test -s dist/mediation.html
          test -s dist/mediation.js
          test -s dist/mediation-admin.js
          test -s dist/mediation-abi.js
          test -s dist/release.json
          test -s dist/app.css
          test -s dist/core.js
          grep -q 'MasterlawEX' dist/index.html
          grep -q 'P2P · ARC TESTNET SANDBOX' dist/p2p.html
          grep -q 'ARC TESTNET · PRE-ESCROW' dist/p2p.html
          grep -q 'Inspector escrow ARC · sólo lectura' dist/p2p.html
          grep -q 'NO FIRMA · NO TX · NO MUEVE FONDOS' dist/p2p.html
          grep -q 'tradeIdByReference(orderRef)' dist/p2p.html
          grep -q "trade:'0x1e6c598e'" dist/p2p.js
          grep -q "byRef:'0x0bb784d8'" dist/p2p.js
          grep -q 'reverseLookupMatches:true' dist/p2p.js
          grep -q 'P2P ESCROW V1.3 · ARC TESTNET ONLY' dist/protocol.html
          grep -q 'Desplegar Escrow V1.3 en ARC' dist/protocol.html
          grep -q 'P2P V1.4 · PRE-REAL-MONEY' dist/mediation.html
          grep -q 'Masterlaw KYC + Wallet Gate' dist/mediation.html
          grep -q 'Vincular wallet ARC' dist/mediation.html
          grep -q 'Masterlaw P2P Case Workspace' dist/mediation.html
          grep -q 'DB WRITES · OFF' dist/mediation.html
          grep -q '/api/exchange/p2p/bind-wallet' dist/mediation.js
          grep -q "entitlement:'\[MEMORY_ONLY\]'" dist/mediation.js
          grep -q '/api/exchange/p2p/admin/prepare-case' dist/mediation-admin.js
          grep -q '/api/exchange/p2p/admin/prepare-evidence' dist/mediation-admin.js
          grep -q '/api/exchange/p2p/admin/prepare-resolution' dist/mediation-admin.js
          grep -q 'MASTERLAWEX_P2P_ACTIVATION_READINESS_V2' dist/mediation-admin.js
          grep -q 'ENTITLEMENT VERIFY · ONLINE' dist/mediation-admin.js
          grep -q 'EDGE ENFORCEMENT · BLOCKED' dist/mediation-admin.js
          grep -q 'P2P_EDGE_ENTITLEMENT_ENFORCEMENT_NOT_ENABLED' dist/mediation-admin.js
          grep -q 'const serverEntitlementEnforced=false' dist/mediation-admin.js
          grep -q 'const casePersistenceEnabled=false' dist/mediation-admin.js
          grep -q 'MASTERLAWEX_RELEASE_V1' dist/release.json
          grep -q '"chain_id": 5042002' dist/release.json
          grep -q '"real_money_enabled": false' dist/release.json
          node -e "const r=require('./dist/release.json'); if(r.schema!=='MASTERLAWEX_RELEASE_V1'||r.chain_id!==5042002||r.real_money_enabled!==false) process.exit(1)"
          grep -q 'openDisputeByArbiter(uint256,bytes32)' dist/mediation-abi.js
          grep -q 'resolveDispute(uint256,bool,bytes32)' dist/mediation-abi.js
          grep -q 'broadcastByBrowser:false' dist/mediation.js
          ! grep -q 'eth_sendTransaction' dist/mediation.js
          ! grep -q 'eth_sendTransaction' dist/mediation-admin.js
          ! grep -E 'localStorage|sessionStorage' dist/mediation-admin.js
          ! grep -E '(localStorage|sessionStorage)\.setItem\([^)]*(entitlement|walletEntitlement)' dist/mediation.js
          grep -q 'AI Control' dist/agents.html
          grep -q "chain:'0x4cef52'" dist/core.js
          grep -q "rpc:'https://rpc.testnet.arc.io'" dist/core.js
          grep -q "explorer:'https://testnet.arcscan.app'" dist/core.js
          grep -q 'READ_RPC_METHODS' dist/core.js
          grep -q 'ensureChain,wait,send' dist/core.js
          ! grep -R -E '84532|Base Sepolia|sepolia.basescan' dist
          count=$(find dist -maxdepth 1 -type f | wc -l)
          test "$count" -eq 27 || { echo "Expected 27 dist files, found $count"; exit 1; }