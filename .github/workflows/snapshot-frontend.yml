name: Snapshot MasterlawEX frontend base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-frontend.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot current production frontend
        shell: bash
        env:
          BASE_URL: https://arcx-exchange.vercel.app
        run: |
          set -euo pipefail
          mkdir -p web-overlay/base
          files=(
            app.css core.js earn.html earn.js identity.html index.html
            list.html list.js portfolio.html portfolio.js protocol.html protocol.js
            registry.js startup.html startup.js trade.js
          )
          for file in "${files[@]}"; do
            echo "snapshot $file"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              -H 'User-Agent: MasterlawEX-Snapshot/1.0' \
              "${BASE_URL}/${file}?snapshot=${GITHUB_SHA}" \
              --output "web-overlay/base/${file}"
            test -s "web-overlay/base/${file}"
          done

      - name: Validate snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f web-overlay/base/index.html
          test -f web-overlay/base/app.css
          test -f web-overlay/base/core.js
          test -f web-overlay/base/trade.js
          grep -q 'MasterlawEX' web-overlay/base/index.html
          ! grep -R --line-number '404: NOT_FOUND' web-overlay/base

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'masterlawex-bot'
          git config user.email 'masterlawex-bot@users.noreply.github.com'
          git add web-overlay/base
          if git diff --cached --quiet; then
            echo 'Snapshot already current.'
            exit 0
          fi
          git commit -m 'chore: internalize production frontend snapshot [skip ci]'
          git push origin HEAD:main
