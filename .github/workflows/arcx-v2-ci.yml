name: ARCX V2 CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arcx-v2-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arcx-v2-ci.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Solidity
        run: npm run build
      - name: Integration test
        run: npm test
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcx-v2-artifacts
          path: build/artifacts.json
          retention-days: 14

  publish-artifact:
    if: github.event_name == 'push'
    needs: compile-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcx-v2-artifacts
          path: build
      - name: Publish verified artifact to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/artifacts.json
          if git diff --cached --quiet; then
            echo "Artifact unchanged"
          else
            git commit -m "chore: publish verified ARCX V2 artifacts [skip ci]"
            git push
          fi
