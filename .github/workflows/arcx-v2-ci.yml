name: ARCX V2 CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/**'
      - 'web-overlay/base/core.js'
      - 'web-overlay/base/protocol.js'
      - 'web-overlay/p2p.js'
      - 'web-overlay/mediation.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arcx-v2-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/**'
      - 'web-overlay/base/core.js'
      - 'web-overlay/base/protocol.js'
      - 'web-overlay/p2p.js'
      - 'web-overlay/mediation.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arcx-v2-ci.yml'

concurrency:
  group: arcx-v2-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "Bootstrapping package-lock.json once from exact dependency pins"
            npm install --no-audit --no-fund
          fi
      - name: Enforce ARC-only network lock
        shell: bash
        run: |
          if grep -R -n -E '84532|Base Sepolia|basescan\.org|sepolia\.basescan' contracts scripts deploy docs web-overlay package.json; then
            echo "Non-ARC network reference detected"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const core = fs.readFileSync('web-overlay/base/core.js', 'utf8');
          const deployer = fs.readFileSync('scripts/deploy-p2p-testnet.js', 'utf8');
          const deployerV14 = fs.readFileSync('scripts/deploy-p2p-v14-arc.js', 'utf8');
          const adminV14 = fs.readFileSync('scripts/p2p-v14-admin.js', 'utf8');
          const requiredCore = [
            "chain:'0x4cef52'",
            "rpc:'https://rpc.testnet.arc.io'",
            "rpcs:['https://rpc.testnet.arc.io','https://rpc.testnet.arc.network']",
            "explorer:'https://testnet.arcscan.app'",
            "usdc:'0x3600000000000000000000000000000000000000'"
          ];
          for (const value of requiredCore) {
            if (!core.includes(value)) throw new Error(`ARC frontend lock missing: ${value}`);
          }
          for (const text of [deployer, deployerV14, adminV14]) {
            for (const value of ['5042002n', 'https://rpc.testnet.arc.io', 'https://testnet.arcscan.app']) {
              if (!text.includes(value)) throw new Error(`ARC tooling lock missing: ${value}`);
            }
          }
          console.log('ARC-ONLY NETWORK LOCK PASS');
          NODE
      - name: Verify P2P browser ABI lock
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { ethers } = require('ethers');
          const protocol = fs.readFileSync('web-overlay/base/protocol.js', 'utf8');
          const p2p = fs.readFileSync('web-overlay/p2p.js', 'utf8');
          const protocolSelectors = {
            asset: ethers.id('asset()').slice(0, 10),
            arbiter: ethers.id('arbiter()').slice(0, 10),
            version: ethers.id('VERSION()').slice(0, 10),
            domain: ethers.id('ORDER_REF_DOMAIN()').slice(0, 10),
            decimals: ethers.id('decimals()').slice(0, 10),
            symbol: ethers.id('symbol()').slice(0, 10)
          };
          for (const [name, selector] of Object.entries(protocolSelectors)) {
            if (!protocol.includes(`${name}:'${selector}'`)) throw new Error(`Protocol browser selector mismatch for ${name}: expected ${selector}`);
          }
          const p2pSelectors = {
            asset: protocolSelectors.asset,
            arbiter: protocolSelectors.arbiter,
            version: protocolSelectors.version,
            domain: protocolSelectors.domain,
            trade: ethers.id('trades(uint256)').slice(0, 10),
            byRef: ethers.id('tradeIdByReference(bytes32)').slice(0, 10)
          };
          for (const [name, selector] of Object.entries(p2pSelectors)) {
            if (!p2p.includes(`${name}:'${selector}'`)) throw new Error(`P2P browser selector mismatch for ${name}: expected ${selector}`);
          }
          const domain = ethers.keccak256(ethers.toUtf8Bytes('MASTERLAWEX_P2P_ORDER_REF_V1'));
          if (!protocol.includes(`P2P_ORDER_REF_DOMAIN='${domain}'`)) throw new Error('Protocol order-ref domain mismatch');
          if (!p2p.includes(`P2P_DOMAIN='${domain}'`)) throw new Error('P2P order-ref domain mismatch');
          if (!p2p.includes("P2P_RECORD_SCHEMA=3")) throw new Error('P2P deployment record schema lock missing');
          console.log('P2P BROWSER ABI LOCK PASS', { protocolSelectors, p2pSelectors, domain });
          NODE
      - name: Validate ARC deployment and mediation tooling
        shell: bash
        run: |
          node --check scripts/deploy-p2p-testnet.js
          node --check scripts/deploy-p2p-v14-arc.js
          node --check scripts/p2p-v14-admin.js
          node <<'NODE'
          const fs = require('fs');
          const admin = fs.readFileSync('scripts/p2p-v14-admin.js', 'utf8');
          for (const forbidden of ['eth_sendTransaction','sendTransaction(','P2P_ARBITER_PRIVATE_KEY','new ethers.Wallet']) {
            if (admin.includes(forbidden)) throw new Error(`prepare-only admin tool contains forbidden signing/broadcast surface: ${forbidden}`);
          }
          for (const required of ['PREPARE_ONLY_MULTISIG_SAFE','openDisputeByArbiter','resolveDispute','safeTransaction']) {
            if (!admin.includes(required)) throw new Error(`admin mediation guard missing: ${required}`);
          }
          console.log('P2P V1.4 PREPARE-ONLY ADMIN PASS');
          NODE
      - name: Compile Solidity
        run: npm run build
      - name: Verify deterministic build and V1.4 mediation surface
        shell: bash
        run: |
          cp build/artifacts.json /tmp/artifacts.first.json
          npm run build
          cmp /tmp/artifacts.first.json build/artifacts.json
          node <<'NODE'
          const a = require('./build/artifacts.json');
          if (a._meta?.schema !== 2 || !a._meta?.buildId) throw new Error('missing build metadata');
          if (!a.MasterlawEXP2PEscrow?.bytecodeSha256) throw new Error('V1.3 artifact missing');
          const v14 = a.MasterlawEXP2PEscrowV14;
          if (!v14?.bytecodeSha256 || v14.source !== 'contracts/MasterlawEXP2PEscrowV14.sol') throw new Error('V1.4 artifact missing');
          const names = v14.abi.filter(x => x.type === 'function').map(x => x.name);
          for (const required of ['openDisputeByArbiter','resolveDispute','proposeMutualSplit','approveMutualSplit','caseHashByTrade','resolutionHashByTrade']) {
            if (!names.includes(required)) throw new Error(`V1.4 mediation ABI missing ${required}`);
          }
          for (const forbidden of ['withdraw','sweep','emergencyWithdraw','adminWithdraw']) {
            if (names.includes(forbidden)) throw new Error(`unsafe V1.4 admin withdrawal function ${forbidden}`);
          }
          const ids=v14.methodIdentifiers;
          for (const sig of ['openDisputeByArbiter(uint256,bytes32)','resolveDispute(uint256,bool,bytes32)','trades(uint256)','caseHashByTrade(uint256)','resolutionHashByTrade(uint256)']) {
            const expected=ethersId(sig);
            if (ids?.[sig] !== expected) throw new Error(`method identifier mismatch ${sig}: ${ids?.[sig]} vs ${expected}`);
          }
          function ethersId(sig){ return require('ethers').ethers.id(sig).slice(2,10); }
          console.log('P2P V1.4 MEDIATION ABI PASS');
          NODE
          sha256sum build/artifacts.json
      - name: Integration test
        run: npm test
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcx-v2-artifacts
          path: build/artifacts.json
          retention-days: 14
      - name: Upload dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcx-v2-lockfile
          path: package-lock.json
          retention-days: 14

  publish-artifact:
    if: github.event_name == 'push'
    needs: compile-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcx-v2-artifacts
          path: build
      - name: Download verified dependency lock
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcx-v2-lockfile
          path: .
      - name: Publish verified build and lockfile to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/artifacts.json package-lock.json
          if git diff --cached --quiet; then
            echo "Verified build and dependency lock unchanged"
          else
            git commit -m "chore: publish verified protocol build [skip ci]"
            git push
          fi
