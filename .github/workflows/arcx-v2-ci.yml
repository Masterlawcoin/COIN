name: ARCX V2 CI

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/P2P_ESCROW_INTEGRATION.md'
      - 'web-overlay/base/core.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arcx-v2-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'docs/P2P_ESCROW_INTEGRATION.md'
      - 'web-overlay/base/core.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/arcx-v2-ci.yml'

concurrency:
  group: arcx-v2-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "Bootstrapping package-lock.json once from exact dependency pins"
            npm install --no-audit --no-fund
          fi
      - name: Enforce ARC-only network lock
        shell: bash
        run: |
          if grep -R -n -E '84532|basescan\.org' contracts scripts deploy docs web-overlay package.json; then
            echo "Non-ARC network reference detected"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const core = fs.readFileSync('web-overlay/base/core.js', 'utf8');
          const deployer = fs.readFileSync('scripts/deploy-p2p-testnet.js', 'utf8');
          const requiredCore = [
            "chain:'0x4cef52'",
            "rpc:'https://rpc.testnet.arc.io'",
            "explorer:'https://explorer.testnet.arc.io'"
          ];
          for (const value of requiredCore) {
            if (!core.includes(value)) throw new Error(`ARC frontend lock missing: ${value}`);
          }
          for (const value of ['5042002n', 'https://rpc.testnet.arc.io', 'https://explorer.testnet.arc.io']) {
            if (!deployer.includes(value)) throw new Error(`ARC deploy lock missing: ${value}`);
          }
          console.log('ARC-ONLY NETWORK LOCK PASS');
          NODE
      - name: Validate ARC deployment tooling
        run: node --check scripts/deploy-p2p-testnet.js
      - name: Compile Solidity
        run: npm run build
      - name: Verify deterministic build
        shell: bash
        run: |
          cp build/artifacts.json /tmp/artifacts.first.json
          npm run build
          cmp /tmp/artifacts.first.json build/artifacts.json
          node -e "const a=require('./build/artifacts.json'); if(a._meta?.schema!==2||!a._meta?.buildId||!a.MasterlawEXP2PEscrow?.bytecodeSha256) process.exit(1)"
          sha256sum build/artifacts.json
      - name: Integration test
        run: npm test
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcx-v2-artifacts
          path: build/artifacts.json
          retention-days: 14
      - name: Upload dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcx-v2-lockfile
          path: package-lock.json
          retention-days: 14

  publish-artifact:
    if: github.event_name == 'push'
    needs: compile-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcx-v2-artifacts
          path: build
      - name: Download verified dependency lock
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arcx-v2-lockfile
          path: .
      - name: Publish verified build and lockfile to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/artifacts.json package-lock.json
          if git diff --cached --quiet; then
            echo "Verified build and dependency lock unchanged"
          else
            git commit -m "chore: publish verified protocol build [skip ci]"
            git push
          fi
